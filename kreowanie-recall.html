<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kreowanie wizerunku w polityce – Fiszki (active recall)</title>
<link rel="stylesheet" href="recall.css">
<style>
  .wstecz-bar { position: sticky; top: var(--wstecz-top, 62px); z-index: 40; height: 0; overflow: visible;
    padding: 0 1.5rem; pointer-events: none; }
  .wstecz { position: relative; top: .7rem; pointer-events: auto; display: inline-flex; align-items: center; gap: .4rem;
    padding: .5rem 1.15rem; border-radius: 999px; background: rgba(14,18,34,.92); border: 1px solid rgba(107,140,255,.6);
    color: #dfe6ff; font-family: inherit; font-size: .85rem; font-weight: 600; text-decoration: none;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 6px 18px rgba(0,0,0,.35);
    transition: background .2s, border-color .2s, transform .1s; }
  .wstecz:hover { background: rgba(38,52,98,.95); border-color: #6b8cff; color: #fff; transform: translateY(-1px); }
  .wstecz-odstep { height: 3.4rem; }
  @media (max-width: 720px) { .wstecz-bar { padding: 0 1rem; } }
</style>
</head>
<body>
<nav id="nav"></nav>
<div class="wstecz-bar"><a class="wstecz" href="swps-kreowanie.html">← Wróć do przedmiotu</a></div><div class="wstecz-odstep"></div>
<script>(function(){function u(){var n=document.querySelector('nav');if(n)document.documentElement.style.setProperty('--wstecz-top',n.offsetHeight+'px');}
u();addEventListener('DOMContentLoaded',u);addEventListener('load',u);addEventListener('resize',u);setTimeout(u,400);})();</script>
<div class="wrap" id="wrap"></div>
<footer>StudyZone &mdash; materiały pomocnicze do nauki</footer>
<script src="kreowanie-data.js"></script>
<script src="recall.js"></script>
</body>
</html>
